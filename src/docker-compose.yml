#      - "9180:9180"   # REST API
#      - "10000:10000" # Prometheus metrics
#    volumes:
#      - scylla-data:/var/lib/scylla

  nats-server-1:
    image: nats:2.9-alpine
    container_name: nats-server-1
    hostname: nats-server-1
    ports:
      - "4222:4222"
      - "8222:8222"
    command: >
      -p 4222 -m 8222
      -server_name n1
      -cluster_name nats-cluster
      -cluster nats://0.0.0.0:6222
      -routes nats://nats-server-2:6222,nats://nats-server-3:6222
      -js
      -sd /data
    volumes:
      - nats-data-1:/data

  nats-server-2:
    image: nats:2.9-alpine
    container_name: nats-server-2
    hostname: nats-server-2
    ports:
      - "4223:4222"
      - "8223:8222"
    command: >
      -p 4222 -m 8222
      -server_name n2
      -cluster_name nats-cluster
      -cluster nats://0.0.0.0:6222
      -routes nats://nats-server-1:6222,nats://nats-server-3:6222
      -js
      -sd /data
    volumes:
      - nats-data-2:/data

  nats-server-3:
    image: nats:2.9-alpine
    container_name: nats-server-3
    hostname: nats-server-3
    ports:
      - "4224:4222"
      - "8224:8222"
    command: >
      -p 4222 -m 8222
      -server_name n3
      -cluster_name nats-cluster
      -cluster nats://0.0.0.0:6222
      -routes nats://nats-server-1:6222,nats://nats-server-2:6222
      -js
      -sd /data
    volumes:
      - nats-data-3:/data

