  postgres:
    image: "postgres:latest"
    container_name: postgres-db
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

#  scylla:
#    image: scylladb/scylla:latest
#    container_name: scylla
#    command:
#      - --smp=1
