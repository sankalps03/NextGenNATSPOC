services:
  dragonfly-kv:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    container_name: dragonfly-kv
    ulimits:
      memlock: -1
    ports:
      - "6380:6379"  # expose on different port
    volumes:
      - dragonflydata-kv:/data
    command: >
      --maxmemory=512mb
      --proactor_threads 2
  dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    # For better performance, consider `host` mode instead `port` to avoid docker NAT.
    # `host` mode is NOT currently supported in Swarm Mode.
    # https://docs.docker.com/compose/compose-file/compose-file-v3/#network_mode
    # network_mode: "host"
    volumes:
      - dragonflydata:/data

  postgres:
    image: "postgres:latest"
    container_name: postgres-db
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  nats-server-1:
    image: nats:2.9-alpine
    container_name: nats-server-1
    hostname: nats-server-1
    ports:
      - "4222:4222"
      - "8222:8222"
    command: >
      -p 4222 -m 8222
      -server_name n1
      -cluster_name nats-cluster
      -cluster nats://0.0.0.0:6222
      -routes nats://nats-server-2:6222,nats://nats-server-3:6222
      -js
      -sd /data
    volumes:
      - nats-data-1:/data

  nats-server-2:
    image: nats:2.9-alpine
    container_name: nats-server-2
    hostname: nats-server-2
    ports:
      - "4223:4222"
      - "8223:8222"
    command: >
      -p 4222 -m 8222
      -server_name n2
      -cluster_name nats-cluster
      -cluster nats://0.0.0.0:6222
      -routes nats://nats-server-1:6222,nats://nats-server-3:6222
      -js
      -sd /data
    volumes:
      - nats-data-2:/data

  nats-server-3:
    image: nats:2.9-alpine
    container_name: nats-server-3
    hostname: nats-server-3
    ports:
      - "4224:4222"
      - "8224:8222"
    command: >
      -p 4222 -m 8222
      -server_name n3
      -cluster_name nats-cluster
      -cluster nats://0.0.0.0:6222
      -routes nats://nats-server-1:6222,nats://nats-server-2:6222
      -js
      -sd /data
    volumes:
      - nats-data-3:/data

